<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双轴伺服调试工具</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
:root {
    --bg: #0a0a0f;
    --panel: #111118;
    --border: #2a2a3a;
    --text: #d4d4e0;
    --dim: #6b6b80;
    --accent: #00d4ff;
    --accent2: #7c5cfc;
    --red: #ff3d5a;
    /* 6通道高对比度颜色 —— 色相间隔60°，亮度统一 */
    --c1: #ff4444;   /* M1速度 - 红 */
    --c2: #44ff44;   /* M2速度 - 绿 */
    --c3: #ffaa00;   /* M1位置 - 橙 */
    --c4: #00ccff;   /* M2位置 - 天蓝 */
    --c5: #ff44ff;   /* M1电流 - 洋红 */
    --c6: #ffff44;   /* M2电流 - 黄 */
    --glow: 0 0 20px rgba(0,212,255,0.15);
    --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden; height: 100vh;
}

/* ===== 顶栏 ===== */
.topbar {
    display:flex; align-items:center; gap:12px;
    padding:8px 16px; height:48px;
    background:linear-gradient(180deg,#15151f,#0e0e16);
    border-bottom:1px solid var(--border);
}
.logo {
    font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.pill {
    display:flex; align-items:center; gap:6px;
    padding:3px 10px; border-radius:20px;
    background:rgba(255,255,255,0.04); border:1px solid var(--border);
    font-size:12px; color:var(--dim);
}
.pill .dot {
    width:7px; height:7px; border-radius:50%;
    background:#444; transition:all 0.3s;
}
.pill .dot.on { background:#00e676; box-shadow:0 0 8px #00e676; }
.pill .dot.sim { background:#ffd600; box-shadow:0 0 8px #ffd600; }
.spacer{flex:1;}
.tb{
    padding:5px 14px; border-radius:6px; border:1px solid var(--border);
    background:rgba(255,255,255,0.03); color:var(--text);
    font-size:12px; cursor:pointer; transition:all 0.15s; font-family:inherit;
}
.tb:hover{background:rgba(255,255,255,0.07);}
.tb.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;font-weight:600;}
.tb.pri:hover{opacity:0.85;}
.tb.stp{background:var(--red);color:#fff;border:none;font-weight:700;letter-spacing:1px;font-size:13px;}
.tb.stp:hover{box-shadow:0 0 25px rgba(255,61,90,0.5);}
.tb-in{
    background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--text);
    padding:4px 8px;border-radius:6px;font-size:12px;
    font-family:'JetBrains Mono',monospace;width:90px;text-align:center;
}

/* ===== 布局 ===== */
.main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 48px);}

/* ===== 图表区 ===== */
.cht-wrap{display:flex;flex-direction:column;padding:12px;gap:8px;overflow:hidden;}
.cht-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.cht-bar label{font-size:11px;color:var(--dim);}
.cht-bar input[type=range]{width:140px;accent-color:var(--accent);}
.cht-bar .val{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);min-width:40px;}
.tag{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 10px;border-radius:4px;cursor:pointer;
    font-size:11px;font-weight:500;user-select:none;
    border:1px solid transparent;transition:all 0.15s;
}
.tag:hover{border-color:rgba(255,255,255,0.15);}
.tag .c{width:10px;height:3px;border-radius:2px;}
.tag.off .c{opacity:0.15;}
.tag.off{color:#444;}
.sep{width:1px;height:14px;background:var(--border);}
#cht{flex:1;min-height:0;}

/* ===== 面板 ===== */
.panel{
    background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.sec{padding:12px 14px;border-bottom:1px solid var(--border);}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.si{
    width:28px;height:28px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
}
.st{font-size:13px;font-weight:600;}
.ss{font-size:11px;color:var(--dim);margin-top:1px;}

/* 控件行 = 标签 + 滑块 + 输入框 + 单位 */
.cr{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.cl{font-size:11px;color:var(--dim);min-width:55px;text-align:right;font-family:'JetBrains Mono',monospace;}
.cr input[type=range]{flex:1;accent-color:var(--accent);}
.ci{
    width:58px;padding:3px 4px;border-radius:4px;
    background:rgba(0,0,0,0.5);border:1px solid var(--border);
    color:var(--accent);font-family:'JetBrains Mono',monospace;
    font-size:12px;text-align:center;transition:border-color 0.15s;
}
.ci:focus{border-color:var(--accent);outline:none;box-shadow:var(--glow);}
.cu{font-size:10px;color:var(--dim);min-width:24px;}

/* 模式按钮 */
.modes{display:flex;gap:3px;background:rgba(0,0,0,0.3);border-radius:6px;padding:2px;}
.mb{
    flex:1;padding:5px 0;border:none;border-radius:4px;
    background:transparent;color:var(--dim);
    font-size:11px;font-family:inherit;font-weight:500;
    cursor:pointer;transition:all 0.15s;
}
.mb:hover{color:var(--text);}
.mb.on{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#000;font-weight:600;box-shadow:0 2px 8px rgba(0,212,255,0.2);
}

/* 状态读数 */
.rd{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;}
.ri{
    display:flex;justify-content:space-between;align-items:center;
    padding:4px 8px;border-radius:4px;background:rgba(0,0,0,0.25);
    border:1px solid rgba(255,255,255,0.03);
}
.ri .k{font-size:10px;color:var(--dim);}
.ri .v{font-family:'JetBrains Mono',monospace;font-size:12px;}

/* 底栏 */
.bot{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;align-items:center;gap:16px;
    padding:4px 16px;height:26px;
    background:var(--panel);border-top:1px solid var(--border);
    font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;
}

/* 自复位摇杆滑块 */
.joy-wrap{position:relative;flex:1;height:28px;display:flex;align-items:center;}
.joy-wrap input[type=range]{width:100%;accent-color:var(--accent);}
.joy-center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:1px;height:16px;background:var(--dim);pointer-events:none;opacity:0.4;
}
/* 范围设置行 */
.lim-row{
    display:flex;align-items:center;gap:4px;margin-bottom:6px;
    padding:4px 6px;border-radius:4px;background:rgba(0,0,0,0.2);
}
.lim-row label{font-size:10px;color:var(--dim);min-width:50px;text-align:right;}
.lim-row .ci{width:52px;font-size:11px;padding:2px 4px;}
.lim-row .cu{font-size:10px;}

/* 图例色块加粗 —— 让颜色更醒目 */
.u-legend .u-series:first-child{display:none;}
@media(max-width:900px){
    .main{grid-template-columns:1fr;}
    .panel{border-left:none;border-top:1px solid var(--border);max-height:50vh;}
}
</style>
</head>
<body>

<div class="topbar">
    <span class="logo">双轴伺服</span>
    <div class="pill"><span class="dot" id="stD"></span><span id="stT">未连接</span></div>
    <span class="spacer"></span>
    <label style="font-size:12px;color:var(--dim);">波特率</label>
    <input class="tb-in" id="baud" value="1000000">
    <button class="tb pri" id="bConn" onclick="conn()">连接串口</button>
    <div class="sep" style="height:24px;"></div>
    <button class="tb stp" onclick="estop()">急 停</button>
</div>

<div class="main">
    <div class="cht-wrap">
        <div class="cht-bar">
            <label>显示点数</label>
            <input type="range" id="ptS" min="500" max="20000" step="500" value="1000" oninput="ptCh(this.value)">
            <span class="val" id="ptV">5000</span>
            <div class="sep"></div>
            <label>电流量程 ±</label>
            <input class="tb-in" id="curRange" value="300" style="width:50px;"
                   onchange="setCurRange(this.value)">
            <span style="font-size:11px;color:var(--dim);">mA</span>
            <div class="sep"></div>
            <span id="tags"></span>
        </div>
        <div id="cht"></div>
    </div>

    <div class="panel">
        <!-- 模式选择 -->
        <div class="sec">
            <div class="sh">
                <div class="si" style="background:rgba(0,212,255,0.1);color:var(--accent);">模</div>
                <div><div class="st">控制模式</div></div>
            </div>
            <div class="cr" style="margin-bottom:8px;">
                <span class="cl" style="color:var(--c1);">M1</span>
                <div class="modes" id="m1G">
                    <button class="mb on" data-m="0" onclick="md('m1',0)">开环</button>
                    <button class="mb" data-m="1" onclick="md('m1',1)">速度</button>
                    <button class="mb" data-m="2" onclick="md('m1',2)">位置</button>
                    <button class="mb" data-m="3" onclick="md('m1',3)">步距角</button>
                </div>
            </div>
            <div class="cr">
                <span class="cl" style="color:var(--c2);">M2</span>
                <div class="modes" id="m2G">
                    <button class="mb on" data-m="0" onclick="md('m2',0)">开环</button>
                    <button class="mb" data-m="1" onclick="md('m2',1)">速度</button>
                    <button class="mb" data-m="2" onclick="md('m2',2)">位置</button>
                    <button class="mb" data-m="3" onclick="md('m2',3)">步距角</button>
                </div>
            </div>
        </div>

        <!-- M1 -->
        <div class="sec">
            <div class="sh">
                <div class="si" style="background:rgba(255,68,68,0.12);color:var(--c1);">1</div>
                <div><div class="st">M1 圆盘 (水平)</div><div class="ss" id="m1D">位置 + 增量 | 限速2RPM</div></div>
            </div>
            <div id="m1C"></div>
            <div class="rd">
                <div class="ri"><span class="k">位置</span><span class="v" style="color:var(--c3)" id="r1p">0</span></div>
                <div class="ri"><span class="k">速度</span><span class="v" style="color:var(--c1)" id="r1s">0.00</span></div>
                <div class="ri"><span class="k">Iq</span><span class="v" style="color:var(--c5)" id="r1i">0 mA</span></div>
                <div class="ri"><span class="k">Id有效</span><span class="v" style="color:var(--dim)" id="r1d">0 mA</span></div>
            </div>
        </div>

        <!-- M2 -->
        <div class="sec">
            <div class="sh">
                <div class="si" style="background:rgba(68,255,68,0.12);color:var(--c2);">2</div>
                <div><div class="st">M2 俯仰 (定位)</div><div class="ss" id="m2D">位置 + 绝对 | ±90°</div></div>
                <span class="spacer"></span>
                <button class="tb" style="font-size:11px;padding:3px 10px;" onclick="zero()">设零点</button>
            </div>
            <div id="m2C"></div>
            <div class="rd">
                <div class="ri"><span class="k">位置</span><span class="v" style="color:var(--c4)" id="r2p">0.0°</span></div>
                <div class="ri"><span class="k">速度</span><span class="v" style="color:var(--c2)" id="r2s">0.00</span></div>
                <div class="ri"><span class="k">Iq</span><span class="v" style="color:var(--c6)" id="r2i">0 mA</span></div>
                <div class="ri"><span class="k">Id有效</span><span class="v" style="color:var(--dim)" id="r2d">0 mA</span></div>
            </div>
        </div>

        <!-- 系统 -->
        <div class="sec">
            <div class="sh">
                <div class="si" style="background:rgba(124,92,252,0.1);color:var(--accent2);">系</div>
                <div><div class="st">系统</div></div>
            </div>
            <div class="cr">
                <span class="cl">帧率</span>
                <input type="range" id="sR" min="30" max="200" step="10" value="100"
                       oninput="document.getElementById('sRV').value=this.value;restartPollLoop()">
                <input class="ci" id="sRV" value="100" style="width:48px;"
                       oninput="document.getElementById('sR').value=this.value;restartPollLoop()">
                <span class="cu">Hz</span>
            </div>
            <div class="rd">
                <div class="ri"><span class="k">母线电压</span><span class="v" id="rv">-- mV</span></div>
                <div class="ri"><span class="k">CRC错误</span><span class="v" id="rc">0</span></div>
                <div class="ri"><span class="k">接收帧率</span><span class="v" id="rf">0</span></div>
                <div class="ri"><span class="k">丢帧</span><span class="v" id="rd">0</span></div>
                <div class="ri" style="grid-column:1/-1;"><span class="k">命令结果</span><span class="v" id="rcmd" style="color:var(--accent);">--</span></div>
            </div>
        </div>
    </div>
</div>

<div class="bot">
    <span>双轴步进伺服调试工具 v0.3</span><span class="spacer"></span><span id="pf">--</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
<script>
// ============================================================
// 环形缓冲区
// ============================================================
class R{
    constructor(n){this.n=n;this.b=new Float64Array(n);this.h=0;this.c=0;}
    push(v){this.b[this.h]=v;this.h=(this.h+1)%this.n;if(this.c<this.n)this.c++;}
    arr(){
        const o=new Float64Array(this.c);
        if(this.c<this.n)o.set(this.b.subarray(0,this.c));
        else{const t=this.n-this.h;o.set(this.b.subarray(this.h,this.n),0);o.set(this.b.subarray(0,this.h),t);}
        return o;
    }
    rsz(nn){const d=this.arr();this.n=nn;this.b=new Float64Array(nn);const cl=Math.min(d.length,nn),st=d.length-cl;this.b.set(d.subarray(st,st+cl));this.h=cl%nn;this.c=cl;}
    clr(){this.h=0;this.c=0;}
}

// ============================================================
// 通道定义 —— 高对比度6色
// ============================================================
const CH=[
    {k:'m1s',l:'M1速度',c:'#ff4444',ax:'spd'},  // 红
    {k:'m2s',l:'M2速度',c:'#44ff44',ax:'spd'},  // 绿
    {k:'m1p',l:'M1位置',c:'#ffaa00',ax:'pos'},  // 橙
    {k:'m2p',l:'M2位置',c:'#00ccff',ax:'pos'},  // 天蓝
    {k:'m1i',l:'M1电流',c:'#ff44ff',ax:'cur'},  // 洋红
    {k:'m2i',l:'M2电流',c:'#ffff44',ax:'cur'},  // 黄
];
let MP=1000,tB=new R(MP),cB=CH.map(()=>new R(MP)),cV=CH.map(()=>true);
let curRangeMA=300; // 电流量程 ±mA，用户可设置

// ============================================================
// uPlot
// ============================================================
let up=null;const ce=document.getElementById('cht');
function mkO(w,h){return{
    width:w,height:h,
    cursor:{show:true,drag:{x:true,y:false}},
    scales:{x:{time:false},spd:{auto:true},pos:{auto:true},
        cur:{auto:false,range:[-curRangeMA,curRangeMA]}},
    axes:[
        {stroke:'#333',grid:{stroke:'#1a1a22',width:1},font:'11px JetBrains Mono',ticks:{stroke:'#222'}},
        {stroke:'#ff444488',grid:{stroke:'#1a0a0a'},scale:'spd',size:50,font:'10px JetBrains Mono',label:'RPM',
         values:(u,v)=>v.map(x=>x.toFixed(1))},
        {stroke:'#ffaa0088',grid:{show:false},scale:'pos',side:1,size:50,font:'10px JetBrains Mono',label:'位置',
         values:(u,v)=>v.map(x=>x.toFixed(0))},
        {stroke:'#ff44ff88',grid:{show:false},scale:'cur',side:1,size:50,font:'10px JetBrains Mono',label:'mA',
         values:(u,v)=>v.map(x=>x.toFixed(0))},
    ],
    series:[{label:'时间'},...CH.map((c,i)=>({
        label:c.l,stroke:c.c,width:2,scale:c.ax,show:cV[i],
    }))],
    legend:{show:false},
};}
function initC(){
    const r=ce.getBoundingClientRect(),w=Math.floor(r.width),h=Math.floor(r.height);
    if(w<50||h<50)return;
    const d=[new Float64Array(0)];CH.forEach(()=>d.push(new Float64Array(0)));
    if(up)up.destroy();up=new uPlot(mkO(w,h),d,ce);
}
new ResizeObserver(()=>{if(!up)return;const r=ce.getBoundingClientRect();up.setSize({width:Math.floor(r.width),height:Math.floor(r.height)});}).observe(ce);

// 通道标签
function bldT(){
    const el=document.getElementById('tags');el.innerHTML='';
    CH.forEach((c,i)=>{
        const t=document.createElement('span');
        t.className='tag'+(cV[i]?'':' off');
        t.innerHTML=`<span class="c" style="background:${c.c}"></span>${c.l}`;
        t.onclick=()=>{cV[i]=!cV[i];t.classList.toggle('off');if(up)up.setSeries(i+1,{show:cV[i]});};
        el.appendChild(t);
    });
}

// ============================================================
// 模式 & 动态控件
// ============================================================
let m1M=0, m2M=0;  // 默认开环
let m1DltMax=200, m2PosMax=30;  // M1增量最大值(cnt), M2位置最大值(°)

const DSC={
    m1:{0:'开环 | 手动Iq/Id/角度',1:'速度 | ±2 RPM',2:'位置 + 增量 | 限速2RPM',3:'步距角 + 增量 | PD'},
    m2:{0:'开环 | 手动Iq/Id/角度',1:'速度 | RPM指令',2:'位置 + 绝对角度',3:'步距角 + 绝对角度 | PD'},
};

// 普通滑块 + 输入框
function sl(id,lbl,mn,mx,v,u,st){
    return `<div class="cr">
        <span class="cl">${lbl}</span>
        <input type="range" id="${id}" min="${mn}" max="${mx}" value="${v}" step="${st||1}"
               oninput="si('${id}',this.value)">
        <input class="ci" id="${id}V" value="${v}"
               onfocus="this.dataset.editing='1'"
               onblur="this.dataset.editing='';ss('${id}',this.value)"
               onkeydown="if(event.key==='Enter'){this.blur();}">
        <span class="cu">${u}</span>
    </div>`;
}
function si(id,v){const e=document.getElementById(id+'V');if(e&&!e.dataset.editing)e.value=v;}
function ss(id,v){const e=document.getElementById(id);if(e){e.value=v;si(id,v);}}

// M1 自复位摇杆
function joyHtml(){
    return `<div class="lim-row">
        <label>最大值</label>
        <input class="ci" id="m1DltLim" value="${m1DltMax}"
               onchange="updM1Lim(this.value)">
        <span class="cu">cnt</span>
    </div>
    <div class="cr">
        <span class="cl">增量</span>
        <div class="joy-wrap">
            <div class="joy-center"></div>
            <input type="range" id="m1Joy" min="-${m1DltMax}" max="${m1DltMax}" value="0" step="1"
                   oninput="si('m1Joy',this.value)"
                   onmouseup="rstJoy()" onpointerup="rstJoy()" ontouchend="rstJoy()">
        </div>
        <input class="ci" id="m1JoyV" value="0" style="width:52px;"
               oninput="ss('m1Joy',this.value)">
        <span class="cu">cnt</span>
    </div>`;
}
function rstJoy(){
    const el=document.getElementById('m1Joy');
    if(el){el.value=0;si('m1Joy',0);}
    // TODO: 发送 delta=0 停止
}
function updM1Lim(v){
    m1DltMax=Math.max(1,parseInt(v)||200);
    const el=document.getElementById('m1Joy');
    if(el){el.min=-m1DltMax;el.max=m1DltMax;el.value=0;si('m1Joy',0);}
}

// M2 位置滑块 —— 直接用角度(°)，带方向说明
function m2PosHtml(){
    return `<div class="lim-row">
        <label>最大角度</label>
        <input class="ci" id="m2PosLim" value="${m2PosMax}"
               onchange="updM2Lim(this.value)">
        <span class="cu">°</span>
    </div>
    <div class="cr">
        <span class="cl">俯仰</span>
        <input type="range" id="m2Po" min="-${m2PosMax}" max="${m2PosMax}" value="0" step="0.1"
               oninput="m2PoSync()">
        <input class="ci" id="m2PoV" value="0.0" style="width:52px;"
               oninput="m2PoManSync(this.value)">
        <span class="cu">°</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:10px;margin-top:-2px;padding:0 60px 0 62px;">

function crc16(data){
    let c=0xFFFF;
    for(let i=0;i<data.length;i++) c=((c<<8)^CRC_TBL[((c>>8)^data[i])&0xFF])&0xFFFF;
    return c;
}

// ============================================================
// 帧构造: AA 55 Len Payload CRC16(LE)
// ============================================================
function buildFrame(payload){
    // payload: Uint8Array (含 CmdID)
    const len=payload.length;
    const frame=new Uint8Array(3+len+2);
    frame[0]=0xAA; frame[1]=0x55; frame[2]=len;
    frame.set(payload,3);
    const c=crc16(frame.subarray(0,3+len));
    frame[3+len]=c&0xFF; frame[3+len+1]=(c>>8)&0xFF;
    return frame;
}

// 小端写入辅助
function i16LE(v){return new Uint8Array(new Int16Array([v]).buffer);}
function u16LE(v){return new Uint8Array(new Uint16Array([v]).buffer);}
function i32LE(v){return new Uint8Array(new Int32Array([v]).buffer);}

// ============================================================
// 命令发送函数
// ============================================================
let txSeq=0;
let serialWriter=null;
let txCount=0;
let txBusy=false;

async function sendCmd(payload){
    if(!serialWriter){console.warn('串口未连接');return;}
    if(txBusy)return; // 上一帧还没发完，跳过
    txBusy=true;
    const frame=buildFrame(payload);
    try{
        await serialWriter.write(frame);
        txCount++;
    }catch(e){
        console.error('TX err:',e);
    }finally{
        txBusy=false;
    }
}

function sendSetMotion(m1delta, m2target){
    const p=new Uint8Array(6);
    p[0]=0x10; p[1]=txSeq++&0xFF;
    p.set(i16LE(m1delta),2); p.set(i16LE(m2target),4);
    sendCmd(p);
}
function sendSetPosition(motor, target){
    const p=new Uint8Array(6);
    p[0]=0x11; p[1]=motor;
    p.set(i32LE(target),2);
    sendCmd(p);
}
function sendSetIqRef(m1iq, m2iq, m1id, m2id, m1ad, m2ad){
    // 12B payload: Iq×2 + Id×2 + AngleDelta×2 (v3 扩展)
    const p=new Uint8Array(13);
    p[0]=0x12;
    p.set(i16LE(m1iq),1); p.set(i16LE(m2iq),3);
    p.set(i16LE(m1id),5); p.set(i16LE(m2id),7);
    p.set(i16LE(m1ad||0),9); p.set(i16LE(m2ad||0),11);
    sendCmd(p);
}

// ============================================================
// 状态帧解析 (48B 帧, Payload 43B)
// ============================================================
const CMD_RESULT_STR=['OK','未知命令','模式错误','校准中','电机运行','Flash锁定','参数错误'];
let rxFrameCount=0;

function parseStatusPayload(d){
    // d: DataView of payload (43 bytes)
    if(d.byteLength<43)return;
    const cmdId=d.getUint8(0);
    if(cmdId!==0x80)return; // 不是状态帧

    const txSeqNo=d.getUint8(1);
    const lastRxSeq=d.getUint8(2);
    const upSeqNo=d.getUint8(3);
    const protoVer=d.getUint8(4);
    const sysFlags=d.getUint8(5);
    const lastCmdResult=d.getUint8(6);
    const vbusMv=d.getUint16(7,true);
    const crcErr=d.getUint16(9,true);

    // M1 block: offset 11, 16 bytes
    const m1mode=d.getUint8(11);
    const m1flags=d.getUint8(12);
    const m1spdMrpm=d.getInt32(13,true); // milliRPM
    const m1pos=d.getInt32(17,true);
    const m1id=d.getInt16(21,true);
    const m1iq=d.getInt16(23,true);
    const m1idEff=d.getInt16(25,true);

    // M2 block: offset 27, 16 bytes
    const m2mode=d.getUint8(27);
    const m2flags=d.getUint8(28);
    const m2spdMrpm=d.getInt32(29,true);
    const m2pos=d.getInt32(33,true);
    const m2id=d.getInt16(37,true);
    const m2iq=d.getInt16(39,true);
    const m2idEff=d.getInt16(41,true);

    const m1spdRpm=m1spdMrpm/1000;
    const m2spdRpm=m2spdMrpm/1000;
    const m2posDeg=m2pos/16384*90;

    rxFrameCount++;

    // 喂波形数据
    const t=performance.now()/1000;
    tB.push(t);
    cB[0].push(m1spdRpm); cB[1].push(m2spdRpm);
    cB[2].push(m1pos);     cB[3].push(m2posDeg);
    cB[4].push(m1iq);      cB[5].push(m2iq);
    fC++;

    // 更新读数
    document.getElementById('r1s').textContent=m1spdRpm.toFixed(3);
    document.getElementById('r2s').textContent=m2spdRpm.toFixed(3);
    document.getElementById('r1p').textContent=m1pos;
    document.getElementById('r2p').textContent=m2posDeg.toFixed(1)+'°';
    document.getElementById('r1i').textContent=m1iq+' mA';
    document.getElementById('r2i').textContent=m2iq+' mA';
    document.getElementById('r1d').textContent=m1idEff+' mA';
    document.getElementById('r2d').textContent=m2idEff+' mA';
    document.getElementById('rv').textContent=vbusMv+' mV';
    document.getElementById('rc').textContent=crcErr;

    // 系统标志 + 命令结果显示
    const wdgTripped=!!(sysFlags&0x08);
    if(wdgTripped){
        document.getElementById('stT').textContent='看门狗触发!';
        document.getElementById('stD').className='dot';
    }else if(sP){
        document.getElementById('stT').textContent='已连接';
        document.getElementById('stD').className='dot on';
    }
    const cmdEl=document.getElementById('rcmd');
    if(cmdEl){
        const txt=CMD_RESULT_STR[lastCmdResult]||('0x'+lastCmdResult.toString(16));
        cmdEl.textContent=txt;
        cmdEl.style.color=lastCmdResult===0?'var(--accent)':'var(--red)';
    }
}

function parseCapsPayload(d){
    if(d.byteLength<9)return;
    const cmdId=d.getUint8(0);
    if(cmdId!==0x81)return;
    const fwVer=d.getUint16(1,true);
    const protoVer=d.getUint8(3);
    const axisCnt=d.getUint8(4);
    const feat=d.getUint32(5,true);
    const major=(fwVer>>8)&0xFF, minor=fwVer&0xFF;
    console.log(`固件 v${major}.${minor}, 协议 v${protoVer}, ${axisCnt}轴, 特性=0x${feat.toString(16)}`);
    document.getElementById('stT').textContent=`已连接 v${major}.${minor}`;
}

// ============================================================
// 串口接收: 字节流 → 帧解析状态机
// ============================================================
let rxBuf=new Uint8Array(256);
let rxLen=0;
let serialReader=null;
let rxRunning=false;

async function rxLoop(){
    rxRunning=true;
    const reader=sP.readable.getReader();
    serialReader=reader;
    try{
        while(true){
            const{value,done}=await reader.read();
            if(done)break;
            // 追加到缓冲区 (确保容量足够)
            const needed=rxLen+value.length;
            if(needed>rxBuf.length){
                const nb=new Uint8Array(Math.max(rxBuf.length*2,needed));
                nb.set(rxBuf.subarray(0,rxLen));rxBuf=nb;
            }
            rxBuf.set(value,rxLen); rxLen+=value.length;
            // 解析帧
            parseRxBuf();
        }
    }catch(e){
        if(e.name!=='AbortError')console.error('RX err:',e);
    }finally{
        reader.releaseLock(); serialReader=null; rxRunning=false;
    }
}

function parseRxBuf(){
    while(rxLen>=6){ // 最小帧6字节
        // 找帧头
        let hdr=-1;
        for(let i=0;i<=rxLen-2;i++){
            if(rxBuf[i]===0xAA&&rxBuf[i+1]===0x55){hdr=i;break;}
        }
        if(hdr<0){rxLen=0;return;} // 无帧头
        if(hdr>0){rxBuf.copyWithin(0,hdr);rxLen-=hdr;} // 跳到帧头

        if(rxLen<3)return; // 等 Len
        const payLen=rxBuf[2];
        if(payLen===0||payLen>64){rxBuf.copyWithin(0,1);rxLen--;continue;} // 无效Len
        const frameLen=3+payLen+2;
        if(rxLen<frameLen)return; // 数据不足

        // CRC校验
        const crcCalc=crc16(rxBuf.subarray(0,3+payLen));
        const crcRecv=rxBuf[3+payLen]|(rxBuf[3+payLen+1]<<8);
        if(crcCalc!==crcRecv){
            rxBuf.copyWithin(0,1);rxLen--;continue; // CRC失败，跳过
        }

        // 有效帧 → 解析
        const payload=new DataView(rxBuf.buffer, rxBuf.byteOffset+3, payLen);
        const cmdId=rxBuf[3];
        if(cmdId===0x80) parseStatusPayload(payload);
        else if(cmdId===0x81) parseCapsPayload(payload);

        // 消费帧
        rxBuf.copyWithin(0,frameLen);rxLen-=frameLen;
    }
}

// 串口连接/断开
// ============================================================
let sP=null;
async function conn(){
    if(sP){
        // 断开
        if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
        if(serialReader)await serialReader.cancel();
        if(serialWriter){serialWriter.releaseLock();serialWriter=null;}
        await sP.close();sP=null;
        document.getElementById('bConn').textContent='连接串口';
        document.getElementById('stD').className='dot';
        document.getElementById('stT').textContent='未连接';
        return;
    }
    try{
        sP=await navigator.serial.requestPort();
        const baud=parseInt(document.getElementById('baud').value)||1152000;
        await sP.open({baudRate:baud,bufferSize:4096});
        serialWriter=sP.writable.getWriter();
        document.getElementById('bConn').textContent='断开连接';
        document.getElementById('stD').className='dot on';
        document.getElementById('stT').textContent='已连接';

        // 启动接收循环
        rxLoop();

        // 握手: 发 QUERY_CAPS
        setTimeout(()=>sendQueryCaps(),200);

        // 发送默认模式 (双轴开环)
        setTimeout(()=>sendSetCtrlMode(2,0),400);

        // 启动一问一答循环
        setTimeout(()=>startPollLoop(),600);
    }catch(e){console.error('连接失败:',e);sP=null;}
}

// 一问一答定时发送 (帧率可调 30~200Hz)
let pollTimer=null,pollToggle=false;
function startPollLoop(){
    if(pollTimer)return;
    const hz=parseInt(document.getElementById('sRV').value)||100;
    const ms=Math.round(1000/Math.max(30,Math.min(200,hz)));
    pollTimer=setInterval(()=>{
        if(!serialWriter)return;
        // 开环模式: SET_MOTION (位置) 和 SET_IQ_REF (电流) 交替发送
        if(m1M===0||m2M===0){
            pollToggle=!pollToggle;
            if(pollToggle){
                const m1delta=parseInt(document.getElementById('m1JoyV')?.value)||0;
                const m2deg=parseFloat(document.getElementById('m2PoV')?.value)||0;
                const m2cnt=Math.round(m2deg/90*16384);
                sendSetMotion(m1delta, m2cnt);
            }else{
                const m1iq=parseInt(document.getElementById('m1IqV')?.value)||0;
                const m1id=parseInt(document.getElementById('m1IdV')?.value)||0;
                const m2iq=parseInt(document.getElementById('m2IqV')?.value)||0;
                const m2id=parseInt(document.getElementById('m2IdV')?.value)||0;
                const m1ad=parseInt(document.getElementById('m1JoyV')?.value)||0;
                sendSetIqRef(m1iq,m2iq,m1id,m2id,m1ad,0);
            }
        } else {
            sendQueryStatus();
        }
    },ms);
}
function restartPollLoop(){
    if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
    startPollLoop();
}

md=function(m,mode){

    if(serialWriter){
        const motor=m==='m1'?1:(m==='m2'?0:2);
        sendSetCtrlMode(motor,mode);
    }
    restartPollLoop();
};

// M1 摇杆松手时发 delta=0
const origRstJoy=rstJoy;
rstJoy=function(){
    origRstJoy();
    if(serialWriter)sendSetMotion(0,0);
};

// 帧率设置
const origSRV=document.getElementById('sRV');
if(origSRV)origSRV.addEventListener('change',()=>{
    if(serialWriter)sendSetStatusRate(parseInt(origSRV.value)||200);
});

// M2 位置滑块: 只更新 UI，不直接发帧（由 poll 循环统一发送）
const origM2PoSync=m2PoSync;
m2PoSync=function(){ origM2PoSync(); };

// M1 摇杆: 只更新 UI，由 poll 循环统一发送
const origSiJoy=si;
si=function(id,v){
    origSiJoy(id,v);
};

// ============================================================
// 初始化
// ============================================================
window.addEventListener('load',()=>{
    // CRC 自检: 协议规定 CRC("123456789") = 0x29B1
    const testVec = new Uint8Array([0x31,0x32,0x33,0x34,0x35,0x36,0x37,0x38,0x39]);
    const testCrc = crc16(testVec);
    console.log('CRC 自检: crc16("123456789") = 0x' + testCrc.toString(16).toUpperCase() +
                (testCrc === 0x29B1 ? ' ✅ 正确' : ' ❌ 错误! 应为 0x29B1'));

    // 模拟一帧 SET_IQ_REF (Iq=100,100 Id=0,0 AD=0,0) 的完整帧计算
    const testPayload = new Uint8Array([0x12, 0x64,0x00, 0x64,0x00, 0x00,0x00, 0x00,0x00, 0x00,0x00, 0x00,0x00]);
    const testFrame = buildFrame(testPayload);
    const frameCrc = (testFrame[testFrame.length-2]) | (testFrame[testFrame.length-1] << 8);
    console.log('SET_IQ_REF(100,100,0,0,0,0) 帧 CRC = 0x' + frameCrc.toString(16).toUpperCase());
    console.log('完整帧 hex:', Array.from(testFrame).map(b=>b.toString(16).padStart(2,'0')).join(' '));

    bldT();rc('m1');rc('m2');initC();requestAnimationFrame(rl);
});
</script>
